<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio by Traubenschlecker</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <!-- Start-Overlay -->
<div id="startOverlay">
  <div class="start-content">
    <h1>Click to Start</h1>
  </div>
</div>

<!-- Musik -->
<audio id="bgMusic" src="song.mp3" loop></audio>




  <!-- Container für 3D-Perspektive -->
  <div class="frame-container">
    <div class="bio-frame" id="bioFrame">
      <h1>Traubenschlecker</h1>

      <!-- Nur Discord-Logo, kein Text mehr -->
      <div class="discord">
        <img src="discord.jpg" alt="Discord Logo" class="discord-logo">
      </div>

      <!-- Plattform-Buttons -->
      <div class="links">
        <a href="https://paypal.com/deinname" target="_blank" class="circle">
          <img src="paypal.png" alt="PayPal">
        </a>
        <a href="https://spotify.com/deinname" target="_blank" class="circle">
          <img src="spotify.png" alt="Spotify">
        </a>
        <a href="https://www.tiktok.com/@traubenschlecker?is_from_webapp=1&sender_device=pc" target="_blank" class="circle">
          <img src="tiktok.png" alt="TikTok">
        </a>
        <a href="https://youtube.com/@traubenschlecker?si=rvnX0wPG--c2AcZ4" target="_blank" class="circle">
          <img src="youtube.png" alt="YouTube">
        </a>
      </div>
    </div>
  </div>

  <!-- Custom Cursor -->
  <div class="custom-cursor" id="customCursor"></div>

  <!-- Script für smooth Cursor & 3D Frame Rotation -->
  <script>
    const cursor = document.getElementById('customCursor');
    const frame = document.getElementById('bioFrame');

    let mouseX = 0, mouseY = 0;
    let cursorX = 0, cursorY = 0;

    document.addEventListener('mousemove', e => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function animate() {
      // Smooth Cursor
      cursorX += (mouseX - cursorX) * 0.15;
      cursorY += (mouseY - cursorY) * 0.15;
      cursor.style.left = cursorX + 'px';
      cursor.style.top = cursorY + 'px';

      // Frame Rotation
      const rect = frame.getBoundingClientRect();
      const xCenter = rect.left + rect.width / 2;
      const yCenter = rect.top + rect.height / 2;

      const deltaX = mouseX - xCenter;
      const deltaY = mouseY - yCenter;

      const rotateY = deltaX / 25;
      const rotateX = -deltaY / 25;

      frame.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

      requestAnimationFrame(animate);
    }

    animate();
  </script>


  <script>
  const overlay = document.getElementById('startOverlay');
  const music = document.getElementById('bgMusic');

  overlay.addEventListener('click', () => {
    // Musik starten
    music.play().catch(err => console.log(err));

    // Overlay verschwinden lassen
    overlay.style.display = 'none';
  });
</script>



</body>
</html>
